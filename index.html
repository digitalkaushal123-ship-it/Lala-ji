  <!-- Interactive Toast Notification -->
  <div 
    id="toastBox"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 text-white px-5 py-3 rounded-2xl shadow-xl border border-gray-700 text-sm flex items-center gap-3 transition-all duration-300 transform opacity-0 translate-y-6 pointer-events-none z-50"
  >
    <div class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center flex-shrink-0">
      <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>
    <span id="toastMessage">एप्लिकेशन डाउनलोड शुरू हो रहा है...</span>
  </div>

  <script>
    // Fetch and validate the complete APK response before triggering the browser save.
    // Subscribe fires only after the full response body has arrived and the save is initiated.
    const downloadBtn = document.getElementById('downloadBtn');
    const btnText = document.getElementById('btnText');
    const toastBox = document.getElementById('toastBox');
    const toastMessage = document.getElementById('toastMessage');
    const APK_URL = 'https://raw.githubusercontent.com/digitalkaushal123-ship-it/Lala-ji/main/lala567.apk';

    function showNotification(msg) {
      toastMessage.textContent = msg;
      toastBox.classList.remove('opacity-0', 'translate-y-6', 'pointer-events-none');
      toastBox.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toastBox.classList.add('opacity-0', 'translate-y-6', 'pointer-events-none');
        toastBox.classList.remove('opacity-100', 'translate-y-0');
      }, 3500);
    }

    downloadBtn.addEventListener('click', async () => {
      if (downloadBtn.disabled) return;
      downloadBtn.disabled = true;
      downloadBtn.classList.remove('pulse-btn');
      btnText.textContent = 'Downloading...';
      showNotification('APK डाउनलोड हो रहा है. कृपया पेज खुला रखें।');

      try {
        const response = await fetch(APK_URL);
        if (!response.ok) throw new Error('APK download request failed (' + response.status + ')');

        const apkBlob = await response.blob(); // resolves only after the complete response body is received
        if (!apkBlob.size) throw new Error('Downloaded file is empty');

        // If the server provides the expected size, reject an incomplete response.
        const expectedSize = Number(response.headers.get('content-length'));
        if (Number.isFinite(expectedSize) && expectedSize > 0 && apkBlob.size !== expectedSize) {
          throw new Error('APK response was incomplete (expected ' + expectedSize + ' bytes, received ' + apkBlob.size + ' bytes)');
        }

        const objectUrl = URL.createObjectURL(apkBlob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = 'lala567.apk';
        document.body.appendChild(link);
        link.click();
        link.remove();

        // This confirms the full APK response reached the browser, not that the user installed it.
        if (typeof window.fbq === 'function') {
          window.fbq('track', 'Subscribe');
        }

        btnText.textContent = 'Download Complete';
        showNotification('APK डाउनलोड तैयार है। Install करने के लिए Downloads में lala567.apk पर टैप करें।');
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
      } catch (error) {
        console.error('APK download failed:', error);
        btnText.textContent = 'Try Download Again';
        showNotification('डाउनलोड नहीं हो पाया। दोबारा कोशिश करें या सीधे APK लिंक खोलें।');
      } finally {
        setTimeout(() => {
          btnText.textContent = 'Download App';
          downloadBtn.disabled = false;
          downloadBtn.classList.add('pulse-btn');
        }, 3500);
      }
    });
  </script>
